[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hvfhv"
version = "0.1.0"
description = "HVFHV Monthly Data Reliability Platform"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "dagster>=1.8.0",
    "dagster-webserver>=1.8.0",
    "streamlit>=1.38.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
